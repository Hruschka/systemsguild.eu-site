- image: /assets/uploads/2022/09/AudioTraveler-150x150.jpg
  html: 'Tom DeMarco’s speculative novel, <em><a href="http://tomdemarco.com/Books/timetraveler.html">The One-Way Time Traveler</a></em>, now available in <a href="https://www.chirpbooks.com/audiobooks/the-one-way-time-traveler-by-tom-demarco">audiobook</a> in addition to <a href="https://www.amazon.com/One-Way-Time-Traveler-Tom-DeMarco-ebook/dp/B07DPTNZLD/">paperback and ebook</a>. Time traveler John Donegal is thrust forward into a matriarchal future, and he can’t go back again. Worse still the great love of his life, Jill is left behind. Any chance of a happy ending here? (Don’t bet against Jill.)'
